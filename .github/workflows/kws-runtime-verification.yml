name: KWS Runtime Verification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sherpa-onnx-kws-spike
    paths:
      - ".github/workflows/kws-runtime-verification.yml"
      - "docs/KWS_INTEGRATION_SPIKE.md"

permissions:
  contents: read

jobs:
  verify-upstream-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned official sherpa-onnx AAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" \
            --output sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  sherpa-onnx-2.0.1.aar" | sha256sum --check

      - name: Verify AAR structure and Android ARM ABIs
        shell: bash
        run: |
          set -euo pipefail
          unzip -l sherpa-onnx-2.0.1.aar | tee aar-contents.txt
          unzip -q sherpa-onnx-2.0.1.aar -d aar
          test -s aar/classes.jar
          test -d aar/jni/arm64-v8a
          test -n "$(find aar/jni/arm64-v8a -maxdepth 1 -type f -name '*.so' -print -quit)"
          test -d aar/jni/armeabi-v7a
          test -n "$(find aar/jni/armeabi-v7a -maxdepth 1 -type f -name '*.so' -print -quit)"
          echo "Verified arm64-v8a and armeabi-v7a JNI payloads."
          find aar/jni -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-2.0.1-aar-verification
          path: |
            aar-contents.txt
            sherpa-onnx-2.0.1.aar
          retention-days: 7
