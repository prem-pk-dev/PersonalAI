name: Android CI

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - development/mvp-foundation
      - feature/sherpa-onnx-kws-spike
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download pinned sherpa-onnx AAR for isolated KWS spike
        if: github.ref == 'refs/heads/feature/sherpa-onnx-kws-spike'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" \
            --output app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum --check

      - name: Clean, test, and rebuild APK without cached build outputs
        run: gradle clean lintDebug testDebugUnitTest assembleDebug --no-build-cache --rerun-tasks

      - name: Verify packaged KWS native libraries for Redmi-compatible ARM ABIs
        if: github.ref == 'refs/heads/feature/sherpa-onnx-kws-spike'
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-files.txt
          grep -Fx 'lib/arm64-v8a/libsherpa-onnx-jni.so' /tmp/apk-files.txt
          grep -Fx 'lib/armeabi-v7a/libsherpa-onnx-jni.so' /tmp/apk-files.txt

      - name: Run KWS class-packaging smoke test on Android emulator
        if: github.ref == 'refs/heads/feature/sherpa-onnx-kws-spike'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: gradle connectedDebugAndroidTest --no-build-cache --rerun-tasks

      - name: Upload fresh debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personalai-debug-apk-fresh
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
