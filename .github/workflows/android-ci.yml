name: Android CI

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - development/mvp-foundation
      - feature/sherpa-onnx-kws-spike
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download pinned sherpa-onnx AAR for isolated KWS spike
        if: github.ref == 'refs/heads/feature/sherpa-onnx-kws-spike'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" \
            --output app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum --check

      - name: Prepare persistent APK signing key
        id: stable-signing
        shell: bash
        env:
          PK_SIGNING_KEYSTORE_BASE64: ${{ secrets.PK_SIGNING_KEYSTORE_BASE64 }}
          PK_SIGNING_STORE_PASSWORD: ${{ secrets.PK_SIGNING_STORE_PASSWORD }}
          PK_SIGNING_KEY_ALIAS: ${{ secrets.PK_SIGNING_KEY_ALIAS }}
          PK_SIGNING_KEY_PASSWORD: ${{ secrets.PK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${PK_SIGNING_KEYSTORE_BASE64}" || -z "${PK_SIGNING_STORE_PASSWORD}" || -z "${PK_SIGNING_KEY_ALIAS}" || -z "${PK_SIGNING_KEY_PASSWORD}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent signing secrets are not configured. Build can be tested, but no APK artifact will be published because its signing identity would not support reliable updates. See docs/ANDROID_APK_SIGNING.md."
            exit 0
          fi
          printf '%s' "$PK_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pk-assistant-signing.jks"
          echo "PK_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/pk-assistant-signing.jks" >> "$GITHUB_ENV"
          echo "PK_SIGNING_STORE_PASSWORD=$PK_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PK_SIGNING_KEY_ALIAS=$PK_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PK_SIGNING_KEY_PASSWORD=$PK_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Clean, test, and rebuild APK without cached build outputs
        run: gradle clean lintDebug testDebugUnitTest assembleDebug --no-build-cache --rerun-tasks

      - name: Verify packaged KWS native libraries for Redmi-compatible ARM ABIs
        if: github.ref == 'refs/heads/feature/sherpa-onnx-kws-spike'
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-files.txt
          grep -Fx 'lib/arm64-v8a/libsherpa-onnx-jni.so' /tmp/apk-files.txt
          grep -Fx 'lib/armeabi-v7a/libsherpa-onnx-jni.so' /tmp/apk-files.txt
          if grep -Eq '^lib/(x86|x86_64)/' /tmp/apk-files.txt; then
            echo "Unexpected x86 native libraries found in ARM-only device APK" >&2
            exit 1
          fi

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          if [[ "${{ steps.stable-signing.outputs.ready }}" == "true" ]]; then
            "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -F "944074fc734ee8e8dab28617abc1a8b4c448a7cbf59a7caf1437e5db20fbba94"
          fi
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^package: name='com.prempk.personalai' versionCode='3' versionName='0.3.0'"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^sdkVersion:'26'"
 
      # Physical target-device validation is more useful for this microphone/ARM
      # feature than a hosted x86_64 emulator. The APK is built and uploaded below.
      - name: Upload persistently signed debug APK for Redmi Note 9 device validation
        if: steps.stable-signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: personalai-debug-apk-device-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
