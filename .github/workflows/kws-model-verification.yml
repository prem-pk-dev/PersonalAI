name: KWS model provenance verification

on:
  push:
    branches:
      - feature/sherpa-onnx-kws-spike
    paths:
      - ".github/workflows/kws-model-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download official English mobile KWS model
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01-mobile.tar.bz2"
          curl --fail --location --retry 3 "$url" --output /tmp/kws-model.tar.bz2
          sha256sum /tmp/kws-model.tar.bz2 | tee /tmp/kws-model.sha256
          mkdir -p /tmp/kws-model
          tar -xjf /tmp/kws-model.tar.bz2 -C /tmp/kws-model
          find /tmp/kws-model -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          readme="$(find /tmp/kws-model -maxdepth 2 -name README.md -print -quit)"
          test -n "$readme"
          cat "$readme"
          root="$(find /tmp/kws-model -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$root/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          test -f "$root/decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          test -f "$root/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          test -f "$root/tokens.txt"
          test -f "$root/keywords.txt"
